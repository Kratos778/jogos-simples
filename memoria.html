<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    a.back {
      color: #00d2ff;
      text-decoration: none;
      font-size: 0.95rem;
    }
    h1 { font-size: 1.6rem; }
    .info {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 1rem;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 400px;
      width: 100%;
    }
    .card {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      user-select: none;
    }
    .card.flipped, .card.matched {
      background: rgba(255,255,255,0.2);
      border-color: #00d2ff;
    }
    .card.matched {
      opacity: 0.6;
      cursor: default;
    }
    .btn {
      margin-top: 25px;
      padding: 12px 28px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    .win-msg {
      margin-top: 20px;
      font-size: 1.3rem;
      color: #00d2ff;
      display: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back">← Voltar</a>
    <h1>Jogo da Memória</h1>
    <div></div>
  </div>

  <div class="info">
    <span>Tentativas: <strong id="moves">0</strong></span>
    <span>Pares: <strong id="pairs">0</strong>/8</span>
  </div>

  <div class="board" id="board"></div>

  <div class="win-msg" id="winMsg">Parabéns! Completaste o jogo!</div>

  <button class="btn" onclick="startGame()">Novo Jogo</button>

  <script>
    const emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
    let cards = [];
    let flipped = [];
    let matched = 0;
    let moves = 0;
    let lock = false;

    function startGame() {
      cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
      flipped = [];
      matched = 0;
      moves = 0;
      lock = false;
      document.getElementById('moves').textContent = 0;
      document.getElementById('pairs').textContent = 0;
      document.getElementById('winMsg').style.display = 'none';

      const board = document.getElementById('board');
      board.innerHTML = '';

      cards.forEach((emoji, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = i;
        card.dataset.emoji = emoji;
        card.onclick = () => flipCard(card);
        board.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      card.textContent = card.dataset.emoji;
      flipped.push(card);

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        lock = true;

        const [c1, c2] = flipped;
        if (c1.dataset.emoji === c2.dataset.emoji) {
          c1.classList.add('matched');
          c2.classList.add('matched');
          matched++;
          document.getElementById('pairs').textContent = matched;
          flipped = [];
          lock = false;

          if (matched === 8) {
            document.getElementById('winMsg').style.display = 'block';
          }
        } else {
          setTimeout(() => {
            c1.classList.remove('flipped');
            c2.classList.remove('flipped');
            c1.textContent = '';
            c2.textContent = '';
            flipped = [];
            lock = false;
          }, 800);
        }
      }
    }

    startGame();
  </script>
</body>
</html>
