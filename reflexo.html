<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Reflexo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    a.back { color: #00d2ff; text-decoration: none; }
    h1 { font-size: 1.6rem; }
    .container {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .instruction {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #ccc;
      line-height: 1.5;
    }
    .box {
      width: 100%;
      height: 220px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
      margin-bottom: 25px;
    }
    .box.waiting { background: #e74c3c; }
    .box.ready { background: #2ecc71; }
    .box.early { background: #f39c12; }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }
    .btn {
      padding: 12px 28px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back">← Voltar</a>
    <h1>Jogo de Reflexo</h1>
    <div></div>
  </div>

  <div class="container">
    <p class="instruction" id="instruction">Clica no botão para começar.<br>Espera a caixa ficar VERDE e clica o mais rápido possível!</p>

    <div class="box waiting" id="box" onclick="handleClick()">Clica para começar</div>

    <div class="stats">
      <div>Tempo: <strong id="time">-</strong></div>
      <div>Melhor: <strong id="best">-</strong></div>
    </div>

    <button class="btn" onclick="resetGame()">Reiniciar</button>
  </div>

  <script>
    let state = 'idle'; // idle, waiting, ready
    let startTime = 0;
    let timeout = null;
    let best = localStorage.getItem('reflexBest') || null;

    if (best) document.getElementById('best').textContent = best + ' ms';

    function handleClick() {
      const box = document.getElementById('box');
      const instruction = document.getElementById('instruction');

      if (state === 'idle') {
        startWaiting();
      } else if (state === 'waiting') {
        // Clicou cedo demais
        clearTimeout(timeout);
        state = 'idle';
        box.className = 'box early';
        box.textContent = 'Clicaste cedo demais!';
        instruction.textContent = 'Espera a caixa ficar verde...';
        setTimeout(() => {
          box.className = 'box waiting';
          box.textContent = 'Clica para tentar de novo';
          instruction.innerHTML = 'Clica no botão para começar.<br>Espera a caixa ficar VERDE e clica o mais rápido possível!';
        }, 1500);
      } else if (state === 'ready') {
        const reaction = Date.now() - startTime;
        state = 'idle';
        box.className = 'box waiting';
        box.textContent = reaction + ' ms';
        document.getElementById('time').textContent = reaction + ' ms';

        if (!best || reaction < best) {
          best = reaction;
          localStorage.setItem('reflexBest', best);
          document.getElementById('best').textContent = best + ' ms';
          instruction.textContent = 'Novo recorde! 🎉';
        } else {
          instruction.textContent = 'Bom tempo! Tenta bater o teu recorde.';
        }
      }
    }

    function startWaiting() {
      state = 'waiting';
      const box = document.getElementById('box');
      box.className = 'box waiting';
      box.textContent = 'Espera...';
      document.getElementById('instruction').textContent = 'Não cliques ainda...';

      const delay = 1500 + Math.random() * 3000; // 1.5s a 4.5s

      timeout = setTimeout(() => {
        state = 'ready';
        startTime = Date.now();
        box.className = 'box ready';
        box.textContent = 'CLICA AGORA!';
        document.getElementById('instruction').textContent = 'Rápido!';
      }, delay);
    }

    function resetGame() {
      clearTimeout(timeout);
      state = 'idle';
      document.getElementById('box').className = 'box waiting';
      document.getElementById('box').textContent = 'Clica para começar';
      document.getElementById('instruction').innerHTML = 'Clica no botão para começar.<br>Espera a caixa ficar VERDE e clica o mais rápido possível!';
      document.getElementById('time').textContent = '-';
    }
  </script>
</body>
</html>
